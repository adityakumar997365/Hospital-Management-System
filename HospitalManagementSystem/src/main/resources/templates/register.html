<!DOCTYPE html>
<html xmlns:th="thymeleaf.org" lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Registration - HMS</title>
<!-- FontAwesome for clinical icons -->
<link rel="stylesheet" href="cloudflare.com">

<style>
/* CORE REUSABLE NAVY STYLING CONFIGURATION */
:root {
	--bg-main: #0f172a;
	--bg-surface: #1e293b;
	--primary-teal: #0ea5e9;
	--primary-hover: #0284c7;
	--text-white: #f8fafc;
	--text-muted: #94a3b8;
	--border-color: rgba(255, 255, 255, 0.1);
	--radius: 12px;
	--transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

body {
	font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
	background-color: var(--bg-main);
	color: var(--text-white);
	min-height: 100vh;
	display: flex;
	flex-direction: column;
}

/* IDENTICAL TOP NAVIGATION BAR */
.navbar {
	background-color: var(--bg-surface);
	border-bottom: 1px solid var(--border-color);
	padding: 0 40px; /* Reduced vertical padding since height is now locked */
	height: 70px; /* Matches standard portal navbar heights perfectly */
	position: sticky;
	top: 0;
	z-index: 100;
	display: flex;
	align-items: center;
}

.nav-container {
	width: 100%;
	max-width: 1400px;
	margin: 0 auto;
	display: flex;
	align-items: center;
	justify-content: space-between; /* Crucial: Pushes logo to far left and button to far right */
}

.logo {
	display: flex;
	align-items: center;
	gap: 10px;
	font-size: 1.25rem;
	font-weight: 700;
	color: var(--text-white);
	text-decoration: none;
}

.logo i, .logo span {
	color: var(--primary-teal);
}

/* 4. BRAND NEW: BUTTON STYLE FOR CHECK REGISTRATION STATUS ACTION LINK */
.btn-requestt {
	/* Starting State: High Visibility Solid Teal Accent Button */
	background-color: var(--primary-teal);
	color: #0f172a; /* Dark slate text for perfect contrast against solid teal */
	border: 1px solid var(--primary-teal);
	padding: 10px 20px;
	border-radius: 8px;
	font-size: 0.9rem;
	font-weight: 600;
	text-decoration: none;
	display: inline-flex;
	align-items: center;
	transition: var(--transition);
	cursor: pointer;
	box-shadow: 0 4px 12px rgba(14, 165, 233, 0.2);
}

.btn-requestt:hover {
	/* Hover State: Swaps to Minimal Ghost Style with Tinted Background Glow */
	background-color: rgba(14, 165, 233, 0.1);
	color: var(--primary-teal); /* Switches text back to electric accent blue */
	border-color: rgba(14, 165, 233, 0.3);
	box-shadow: none;
	transform: translateY(-1px);
}


/* REGISTRATION GRID LAYOUT */
.register-wrapper {
	flex: 1;
	display: flex;
	align-items: center;
	justify-content: center;
	padding: 40px 20px;
}

.register-card {
	background-color: var(--bg-surface);
	border-radius: var(--radius);
	padding: 40px;
	width: 100%;
	max-width: 600px;
	box-shadow: 0 25px 35px -12px rgba(0, 0, 0, 0.6);
	border: 1px solid rgba(255, 255, 255, 0.03);
}

.register-header {
	text-align: center;
	margin-bottom: 30px;
}

.register-header h2 {
	font-size: 1.75rem;
	font-weight: 700;
	margin-bottom: 6px;
}

.register-header p {
	color: var(--text-muted);
	font-size: 0.9rem;
}

/* FORM FIELD LAYOUT PATTERNS */
.form-grid {
	display: grid;
	grid-template-columns: 1fr 1fr;
	gap: 20px;
	margin-bottom: 20px;
}

@media ( max-width : 580px) {
	.form-grid {
		grid-template-columns: 1fr;
		gap: 15px;
	}
}

.form-group {
	display: flex;
	flex-direction: column;
}

.form-group.full-width {
	grid-column: span 2;
}

@media ( max-width : 580px) {
	.form-group.full-width {
		grid-column: span 1;
	}
}

.form-group label {
	font-size: 0.8rem;
	font-weight: 700;
	text-transform: uppercase;
	letter-spacing: 0.05em;
	color: var(--text-muted);
	margin-bottom: 8px;
}

.input-wrapper {
	position: relative;
	display: flex;
	align-items: center;
}

.input-wrapper i.input-icon {
	position: absolute;
	left: 14px;
	color: var(--text-muted);
	font-size: 1rem;
}

.form-control {
	width: 100%;
	padding: 14px 14px 14px 42px;
	background-color: rgba(15, 23, 42, 0.6);
	border: 1px solid var(--border-color);
	border-radius: 8px;
	color: var(--text-white);
	font-size: 0.95rem;
	outline: none;
	transition: var(--transition);
}

select.form-control {
	appearance: none;
	cursor: pointer;
}

.form-control:focus {
	border-color: var(--primary-teal);
	box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
}

/* PASSWORD STYLING & INTERACTION EYE */
.password-toggle {
	position: absolute;
	right: 14px;
	color: var(--text-muted);
	cursor: pointer;
	background: none;
	border: none;
	font-size: 1rem;
}

.password-toggle:hover {
	color: var(--text-white);
}

/* BUTTON ACTION EXECUTORS */
.btn-submit {
	width: 100%;
	background-color: var(--primary-teal);
	color: var(--bg-main);
	border: none;
	padding: 14px;
	border-radius: 8px;
	font-size: 1rem;
	font-weight: 600;
	cursor: pointer;
	box-shadow: 0 4px 14px rgba(14, 165, 233, 0.3);
	transition: var(--transition);
	margin-top: 10px;
	display: flex;
	align-items: center;
	justify-content: center;
	gap: 8px;
}

.btn-submit:hover {
	background-color: var(--primary-hover);
	transform: translateY(-1px);
}

/* NAVIGATION REDIRECTION FOOTER HOOK */
.register-footer {
	text-align: center;
	margin-top: 24px;
	font-size: 0.9rem;
	color: var(--text-muted);
}

.register-footer a {
	color: var(--primary-teal);
	text-decoration: none;
	font-weight: 600;
	transition: var(--transition);
}

.register-footer a:hover {
	color: var(--primary-hover);
	text-decoration: underline;
}
</style>
</head>
<body>

	<!-- TOP NAVIGATION BAR -->
	<nav class="navbar">
		<div class="nav-container">
			<a th:href="@{/}" class="logo"> 
			 Hospital <span>Management
					System</span>
			</a>
			
			<a th:href="@{/register/check-request}" class="btn-requestt"> Check Registration Status
		   </a>
		</div>
	</nav>

	<!-- CONTENT WRAPPER -->
	<main class="register-wrapper">
		<div class="register-card">

			<div class="register-header">
				<h2>Patient Registration</h2>
				<p>All input criteria are strictly mandatory for secure health
					record creation</p>
			</div>

			<!-- REGISTRATION FORM -->
			<form th:action="@{/register/patient}" method="POST">

				<div class="form-grid">
					<!-- 1. FULL NAME FIELD -->
					<div class="form-group full-width">
						<label for="name">Full Name</label>
						<div class="input-wrapper">
							<i class="fa-solid fa-user input-icon"></i> <input type="text"
								id="name" name="name" maxlength="100" class="form-control"
								placeholder="Enter full legal name" required>
						</div>
					</div>

					<!-- 2. DATE OF BIRTH FIELD (FIXED CONTRAST VISIBILITY) -->
					<div class="form-group"
						style="display: flex; flex-direction: column; gap: 8px;">
						<label for="dateOfBirth"
							style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted);">Date
							of Birth</label>
						<div class="input-wrapper"
							style="position: relative; display: flex; align-items: center;">

							<!-- Date Input Field with Explicit White Text/Icon Scheme Forced Overrides -->
							<input type="date" id="dateOfBirth" name="dateOfBirth"
								class="form-control color-forced-date" required
								style="width: 100%; padding: 14px 14px 14px 42px; background-color: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-color); border-radius: 8px; color: #ffffff; font-size: 0.95rem; outline: none; transition: var(--transition); color-scheme: dark;"
								onfocus="this.style.borderColor='var(--primary-teal)'"
								onblur="this.style.borderColor='var(--border-color)'">
						</div>
					</div>

					<!-- 3. GENDER SELECTION DROPDOWN -->
					<div class="form-group">
						<label for="gender">Gender</label>
						<div class="input-wrapper">
							<i class="fa-solid fa-venus-mars input-icon"></i> <select
								id="gender" name="gender" class="form-control" required>
								<option value="" disabled selected hidden="">Select
									gender</option>
								<option value="Male">Male</option>
								<option value="Female">Female</option>
								<option value="Other">Other</option>
							</select>
						</div>
					</div>

					<!-- 4. CONTACT NUMBER FIELD -->
					<div class="form-group full-width">
						<label for="contactNumber">Contact Number</label>
						<div class="input-wrapper">
							<i class="fa-solid fa-phone input-icon"></i> <input type="tel"
								id="contactNumber" name="contactNumber" maxlength="15"
								class="form-control" placeholder="E.g., 99XXXX7890" required>
						</div>
					</div>

					<!-- 5. ACCOUNT PASSWORD FIELD -->
					<div class="form-group">
						<label for="password">Account Password</label>
						<div class="input-wrapper">
							<i class="fa-solid fa-lock input-icon"></i> <input
								type="password" id="password" name="password"
								class="form-control" placeholder="Create safe password" required>
							<button type="button" class="password-toggle"
								onclick="togglePasswordVisibility('password', 'eyeIcon')">
								<i class="fa-solid fa-eye" id="eyeIcon"></i>
							</button>
						</div>
					</div>

					<!-- 6. CONFIRM PASSWORD FIELD -->
					<div class="form-group">
						<label for="confirmPassword">Confirm Password</label>
						<div class="input-wrapper">
							<i class="fa-solid fa-lock-open input-icon"></i> <input
								type="password" id="confirmPassword" name="confirmPassword"
								class="form-control" placeholder="Retype password" required>
							<button type="button" class="password-toggle"
								onclick="togglePasswordVisibility('confirmPassword', 'confirmEyeIcon')">
								<i class="fa-solid fa-eye" id="confirmEyeIcon"></i>
							</button>
						</div>
					</div>

					<!-- 7. RESIDENTIAL ADDRESS FIELD -->
					<div class="form-group full-width">
						<label for="address">Permanent Address</label>
						<div class="input-wrapper">
							<i class="fa-solid fa-location-dot input-icon"></i> <input
								type="text" id="address" name="address" maxlength="255"
								class="form-control"
								placeholder="Street name, city, apartment suite layout details"
								required>
						</div>
					</div>
				</div>

				<!-- SUBMIT REGISTER ACCELERATOR -->
				<button type="submit" class="btn-submit">
					Create Account <i class="fa-solid fa-user-plus"></i>
				</button>

			</form>

			<!-- FOOTER LINK BACK TO ACCESS PORTAL -->
			<div class="register-footer">
				Already registered? <a th:href="@{/login}">Return to login
					access panel</a>
			</div>

		</div>
	</main>

	<!-- FORM VALIDATION AND MULTI-EYE TOGGLE LOGIC -->
	<script>
		// Intercepts submission to check passwords locally first
		document
				.querySelector('form')
				.addEventListener(
						'submit',
						function(event) {
							const password = document
									.getElementById('password').value;
							const confirmPassword = document
									.getElementById('confirmPassword').value;

							if (password !== confirmPassword) {
								event.preventDefault();
								alert("Validation Error: Passwords do not match! Please check and try again.");
							}
						});

		// Toggle engine supporting separate configurations
		function togglePasswordVisibility(fieldId, iconId) {
			const inputField = document.getElementById(fieldId);
			const eyeIcon = document.getElementById(iconId);

			if (inputField.type === 'password') {
				inputField.type = 'text';
				eyeIcon.classList.replace('fa-eye', 'fa-eye-slash');
			} else {
				inputField.type = 'password';
				eyeIcon.classList.replace('fa-eye-slash', 'fa-eye');
			}
		}
	</script>

</body>
</html>
