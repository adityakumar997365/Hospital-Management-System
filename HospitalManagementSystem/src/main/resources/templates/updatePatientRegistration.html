<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update Profile Details - HMS</title>
<!-- FontAwesome for professional medical status icons -->
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
/* CORE REUSABLE NAVY STYLING CONFIGURATION */
:root {
	--bg-main: #0f172a;
	--bg-surface: #1e293b;
	--primary-teal: #0ea5e9;
	--primary-hover: #0284c7;
	--text-white: #f8fafc;
	--text-muted: #94a3b8;
	--border-color: rgba(255, 255, 255, 0.1);
	--radius: 12px;
	--transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

body {
	font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
	background-color: var(--bg-main);
	color: var(--text-white);
	min-height: 100vh;
	display: flex;
	flex-direction: column;
}

/* IDENTICAL TOP NAVIGATION BAR */
.navbar {
	background-color: var(--bg-surface);
	border-bottom: 1px solid var(--border-color);
	padding: 0 40px;
	height: 70px;
	position: sticky;
	top: 0;
	z-index: 100;
	display: flex;
	align-items: center;
}

.nav-container {
	width: 100%;
	max-width: 1400px;
	margin: 0 auto;
	display: flex;
	align-items: center;
	justify-content: space-between;
}

.logo {
	display: flex;
	align-items: center;
	gap: 10px;
	font-size: 1.25rem;
	font-weight: 700;
	color: var(--text-white);
	text-decoration: none;
}

.logo i, .logo span {
	color: var(--primary-teal);
}

/* REGISTRATION GRID LAYOUT */
.register-wrapper {
	flex: 1;
	display: flex;
	align-items: center;
	justify-content: center;
	padding: 40px 20px;
}

.register-card {
	background-color: var(--bg-surface);
	border-radius: var(--radius);
	padding: 40px;
	width: 100%;
	max-width: 600px;
	box-shadow: 0 25px 35px -12px rgba(0, 0, 0, 0.6);
	border: 1px solid rgba(255, 255, 255, 0.03);
}

.register-header {
	text-align: center;
	margin-bottom: 30px;
}

.register-header h2 {
	font-size: 1.75rem;
	font-weight: 700;
	margin-bottom: 6px;
}

.register-header p {
	color: var(--text-muted);
	font-size: 0.9rem;
}

/* FORM FIELD LAYOUT PATTERNS */
.form-grid {
	display: grid;
	grid-template-columns: 1fr 1fr;
	gap: 20px;
	margin-bottom: 20px;
}

@media ( max-width : 580px) {
	.form-grid {
		grid-template-columns: 1fr;
		gap: 15px;
	}
}

.form-group {
	display: flex;
	flex-direction: column;
}

.form-group.full-width {
	grid-column: span 2;
}

@media ( max-width : 580px) {
	.form-group.full-width {
		grid-column: span 1;
	}
}

.form-group label {
	font-size: 0.8rem;
	font-weight: 700;
	text-transform: uppercase;
	letter-spacing: 0.05em;
	color: var(--text-muted);
	margin-bottom: 8px;
}

.input-wrapper {
	position: relative;
	display: flex;
	align-items: center;
}

.input-wrapper i.input-icon {
	position: absolute;
	left: 14px;
	color: var(--text-muted);
	font-size: 1rem;
	pointer-events: none;
}

.form-control {
	width: 100%;
	padding: 14px 14px 14px 42px;
	background-color: rgba(15, 23, 42, 0.6);
	border: 1px solid var(--border-color);
	border-radius: 8px;
	color: var(--text-white);
	font-size: 0.95rem;
	outline: none;
	transition: var(--transition);
}

.form-control:focus {
	border-color: var(--primary-teal);
	box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
}

/* BUTTON ACTION EXECUTORS */
.btn-submit {
	width: 100%;
	background-color: var(--primary-teal);
	color: var(--bg-main);
	border: none;
	padding: 14px;
	border-radius: 8px;
	font-size: 1rem;
	font-weight: 600;
	cursor: pointer;
	box-shadow: 0 4px 14px rgba(14, 165, 233, 0.3);
	transition: var(--transition);
	margin-top: 10px;
	display: flex;
	align-items: center;
	justify-content: center;
	gap: 8px;
}

.btn-submit:hover {
	background-color: var(--primary-hover);
	transform: translateY(-1px);
}

/* NAVIGATION REDIRECTION FOOTER HOOK */
.register-footer {
	text-align: center;
	margin-top: 24px;
	font-size: 0.9rem;
	color: var(--text-muted);
}

.register-footer a {
	color: var(--primary-teal);
	text-decoration: none;
	font-weight: 600;
	transition: var(--transition);
}

.register-footer a:hover {
	color: var(--primary-hover);
	text-decoration: underline;
}
</style>
</head>
<body>

	<!-- TOP NAVIGATION BAR -->
	<nav class="navbar">
		<div class="nav-container">
			<a th:href="@{/}" class="logo"> <i
				class="fa-solid fa-heart-pulse"></i> Hospital <span>Management
					System</span>
			</a>
		</div>
	</nav>

	<!-- CONTENT WRAPPER -->
	<main class="register-wrapper">
		<div class="register-card">

			<div class="register-header">
				<h2>
					<i class="fa-solid fa-pen-to-square"
						style="color: var(--primary-teal); margin-right: 4px;"></i> Update
					Details
				</h2>
				<p>Modify registration details below and resubmit for evaluation
					review</p>
			</div>

			<!-- SYSTEM CORRECTION REGISTRATION FORM -->
			<form th:action="@{/register/update-submit}"
				th:object="${patientData}" method="post">

				<!-- CRITICAL PERSISTENT ENTITY POINTER KEY IDENTITY -->
				<input type="hidden" th:field="*{patientRegisterId}" />

				<div class="form-grid">

					<!-- 1. PATIENT NAME CORRECTION LAYOUT -->
					<div class="form-group full-width">
						<label for="name">Full Name</label>
						<div class="input-wrapper">
							<i class="fa-solid fa-user input-icon"></i> <input type="text"
								id="name" th:field="*{name}" class="form-control" required>
						</div>
					</div>

					<!-- 2. CONTACT NUMBER CORRECTION LAYOUT -->
					<div class="form-group full-width">
						<label for="contactNumber">Contact Number</label>
						<div class="input-wrapper">
							<i class="fa-solid fa-phone input-icon"></i> <input type="tel"
								id="contactNumber" th:field="*{contactNumber}"
								class="form-control" maxlength="10" required>
						</div>
						<!-- Add this line right here for error message injection -->
						<small id="phoneError"
							style="color: #ef4444; display: none; margin-top: 6px; font-size: 0.85rem; font-weight: 600; text-align: left;"></small>
					</div>


					<!-- 3. DATE OF BIRTH CORRECTION LAYOUT -->
					<div class="form-group full-width">
						<label for="dateOfBirth">Date of Birth</label>
						<div class="input-wrapper">
							<i class="fa-solid fa-calendar-days input-icon"></i> <input
								type="date" id="dateOfBirth" th:field="*{dateOfBirth}"
								class="form-control" style="color-scheme: dark;" required>
						</div>
					</div>

					<!-- 4. ADDRESS CORRECTION LAYOUT (ADDED) -->
					<div class="form-group full-width">
						<label for="address">Residential Address</label>
						<div class="input-wrapper">
							<i class="fa-solid fa-location-dot input-icon"></i> <input
								type="text" id="address" th:field="*{address}"
								class="form-control"
								placeholder="E.g., Street Name, City, Pincode" required>
						</div>
					</div>


				</div>

				<!-- EXECUTOR COMMAND ACTION SUBMIT BUTTON -->
				<button type="submit" class="btn-submit">
					Update & Submit <i class="fa-solid fa-cloud-arrow-up"></i>
				</button>

			</form>

			<!-- CANCEL REVERSION STEP LINKS -->
			<div class="register-footer">
				<a
					th:href="@{/register/check-request(phone=${patientData.contactNumber})}">
					<i class="fa-solid fa-arrow-left"></i> Cancel and Return to Tracker
				</a>
			</div>

		</div>
	</main>
	<!-- Load jQuery first -->
	<script
		src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>


	<script th:inline="javascript">
		$(document)
				.ready(
						function() {
							// Save the original phone number on page load to prevent false-positive errors
							var originalPhoneNumber = $('#contactNumber').val()
									.trim();

							$('#contactNumber')
									.on(
											'blur',
											function() {
												var $phoneInput = $(this);
												var phoneNumber = $phoneInput
														.val().trim();
												var $errorElement = $('#phoneError');

												// 1. Clear error states if the input field is empty
												if (phoneNumber === "") {
													$errorElement.hide();
													$phoneInput.css(
															'border-color', '');
													$phoneInput[0]
															.setCustomValidity("");
													return;
												}

												// 2. Safeguard Check: If the number matches their own original number, it's valid!
												if (phoneNumber === originalPhoneNumber) {
													$errorElement.hide();
													$phoneInput.css(
															'border-color', '');
													$phoneInput[0]
															.setCustomValidity("");
													return;
												}

												// 3. Local Validation: Check if input length is exactly 10 and contains only digits
												if (phoneNumber.length !== 10
														|| !/^\d+$/
																.test(phoneNumber)) {
													$errorElement
															.text(
																	"Please enter a valid 10-digit phone number.")
															.show();
													$phoneInput.css(
															'border-color',
															'red');
													$phoneInput[0]
															.setCustomValidity("Invalid phone number length");
													return;
												}

												// 4. Send AJAX GET request to the existing Spring Boot controller endpoint
												$
														.ajax({
															url : '/hms/register/check-phone', // Reusing your exact same controller endpoint
															type : 'GET',
															data : {
																phone : phoneNumber
															},
															dataType : 'json',
															success : function(
																	exists) {
																if (exists) {
																	// Number belongs to a DIFFERENT patient already
																	$errorElement
																			.text(
																					"This contact number is already registered to another account.")
																			.show();
																	$phoneInput
																			.css(
																					'border-color',
																					'red');
																	$phoneInput[0]
																			.setCustomValidity("Duplicate phone number");
																} else {
																	// Number is unique and available
																	$errorElement
																			.hide();
																	$phoneInput
																			.css(
																					'border-color',
																					'green');
																	$phoneInput[0]
																			.setCustomValidity("");
																}
															},
															error : function(
																	xhr) {
																console
																		.error("AJAX Error Status: "
																				+ xhr.status);
															}
														});
											});
						});
	</script>

</body>
</html>
