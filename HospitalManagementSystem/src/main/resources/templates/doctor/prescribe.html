<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Medical Prescription - HMS</title>
    <!-- FontAwesome Framework Integration for Dashboard Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* HMS DESIGN SYSTEM VARIABLE SYSTEM */
        :root {
            --bg-main: #0f172a;
            --bg-surface: #1e293b;
            --bg-body: #0b0f19;
            --primary-teal: #0ea5e9;
            --primary-hover: #0284c7;
            --accent-amber: #f59e0b;
            --text-white: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --radius: 12px;
            --transition: all 0.25s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* 1. STICKY TOP BRAND LOGO NAVBAR MODULE */
        .navbar {
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            padding: 0 40px;
            height: 70px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
        }

        .nav-container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-white);
            text-decoration: none;
        }

        .logo span {
            color: var(--primary-teal);
        }

        .btn-nav-exit {
            background-color: rgba(255, 255, 255, 0.03);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-nav-exit:hover {
            background-color: rgba(255, 255, 255, 0.08);
            color: var(--text-white);
        }

        /* 2. CENTRAL VIEWPORT FLEX PANELS */
        .content-viewport-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .prescription-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            width: 100%;
            max-width: 620px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .prescription-header {
            background: linear-gradient(135deg, rgba(30, 41, 59, 1) 0%, rgba(14, 165, 233, 0.04) 100%);
            padding: 32px;
            border-bottom: 1px dotted var(--border-color);
        }

        .prescription-header h2 {
            font-size: 1.45rem;
            font-weight: 700;
            color: var(--text-white);
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
        }

        .prescription-header h2 i {
            color: var(--primary-teal);
        }

        .prescription-header p {
            color: var(--text-muted);
            font-size: 0.88rem;
        }

        .prescription-body {
            padding: 32px;
        }

        .meta-section-title {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--primary-teal);
            margin-bottom: 14px;
        }

        /* CARD LABELED GRID DATA METADATA DATA BOX */
        .patient-meta-box {
            background-color: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 28px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .meta-item-label {
            color: var(--text-muted);
            font-size: 0.85rem;
            display: block;
            margin-bottom: 4px;
        }

        .meta-item-value {
            color: var(--text-white);
            font-weight: 600;
            font-size: 0.95rem;
        }

        /* INPUT WRAPPER AND LABELS DESIGN CONTAINER */
        .form-group-stack {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 28px;
        }

        .form-control-layout {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-control-layout label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-white);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-control-layout label i {
            color: var(--primary-teal);
            font-size: 0.9rem;
            width: 16px;
        }

        .input-field-style {
            background-color: #0b0f19;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px 16px;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
            width: 100%;
            box-sizing: border-box;
            transition: var(--transition);
        }

        .input-field-style:focus {
            border-color: var(--primary-teal);
            box-shadow: 0 0 0 1px rgba(14, 165, 233, 0.15);
        }

        /* BUTTON ACTION LAYERS WRAPPERS */
        .form-action-row {
            display: flex;
            gap: 14px;
            justify-content: flex-end;
            border-top: 1px solid var(--border-color);
            padding-top: 24px;
        }

        .btn-cancel {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 0 24px;
            height: 42px;
            border-radius: 6px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            font-size: 0.9rem;
            font-weight: 600;
            transition: var(--transition);
        }

        .btn-cancel:hover {
            background-color: rgba(255, 255, 255, 0.04);
            color: var(--text-white);
        }

        .btn-submit-prescription {
            background-color: var(--primary-teal);
            color: #0b0f19;
            border: none;
            padding: 0 26px;
            height: 42px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.15);
        }

        .btn-submit-prescription:hover {
            background-color: var(--primary-hover);
            color: var(--text-white);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <!-- 1. IDENTICAL TOP BRANDED STICKY NAVIGATION HEADER NAVBAR -->
    <nav class="navbar">
        <div class="nav-container">
            <a th:href="@{/}" class="logo">
                Hospital <span>Management System</span>
            </a>
            <a th:href="@{/doctor/dashboard}" class="btn-nav-exit">
                <i class="fa-solid fa-arrow-left-long"></i> Dashboard Terminal
            </a>
        </div>
    </nav>

    <!-- 2. CENTRALIZED BILL CARD PANEL FRAME CONTAINER -->
    <main class="content-viewport-wrapper">
        <div class="prescription-card">
            
            <div class="prescription-header">
                <h2><i class="fa-solid fa-file-medical"></i> Issue Medical Prescription</h2>
                <p>Record clinical diagnoses, prescription line entries, and matching treatment regimens</p>
            </div>

            <div class="prescription-body">
                
                <!-- Read-Only Consultation Context Fields Block -->
                <div class="meta-section-title">Consultation Context</div>
                <div class="patient-meta-box">
                    <div>
                        <span class="meta-item-label">Target Patient Name</span>
                        <span class="meta-item-value" th:text="${appointment.patient.name}">John Doe</span>
                    </div>
                    <div>
                        <span class="meta-item-label">Appointment Calendar Date</span>
                        <span class="meta-item-value" style="color: var(--accent-amber);" th:text="${appointment.appointmentDate}">2026-05-18</span>
                    </div>
                </div>

                <!-- Core Patient Treatment Intake Form Block -->
                <div class="meta-section-title">Clinical Entry Ledger</div>
                
                <form th:action="@{/doctor/appointment/{id}/prescribe(id=${appointment.appointmentId})}" method="post">
                    
                    <div class="form-group-stack">
                        <!-- A. Diagnosis Assessment Field Selector Container -->
                        <div class="form-control-layout">
                            <label for="diagnosisField"><i class="fa-solid fa-stethoscope"></i> Diagnosis </label>
                            <input type="text" id="diagnosisField" name="diagnosis" required 
                                   placeholder="e.g. Acute Viral Nasopharyngitis" class="input-field-style">
                        </div>

                        <!-- B. Prescribed Pharmacy Formulation Selector Container -->
                        <div class="form-control-layout">
                            <label for="medicineField"><i class="fa-solid fa-capsules"></i> Prescribed Medicine</label>
                            <input type="text" id="medicineField" name="medicine" required 
                                   placeholder="e.g. Amoxicillin 500mg" class="input-field-style">
                        </div>

                        <!-- C. Dosage Instructions Text Parameter Field Container -->
                        <div class="form-control-layout">
                            <label for="dosageField"><i class="fa-solid fa-clock-rotate-left"></i> Dosage Instructions</label>
                            <input type="text" id="dosageField" name="dosage" required 
                                   placeholder="e.g. 1 tablet every 8 hours for 7 days" class="input-field-style">
                        </div>
                    </div>

                    <!-- Layout Submissions & Action Form Router Row -->
                    <div class="form-action-row">
                        <a th:href="@{/doctor/dashboard}" class="btn-cancel">Cancel Entry</a>
                        <button type="submit" class="btn-submit-prescription">
                            <i class="fa-solid fa-file-signature"></i> Submit Prescription
                        </button>
                    </div>

                </form>

            </div>

        </div>
    </main>

</body>
</html>
