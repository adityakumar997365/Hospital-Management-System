<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Reset Password - Hospital Management System</title>
<!-- FontAwesome for professional medical status icons -->
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
/* MATCHING CLINICAL COLOR PALETTE */
:root {
	--bg-main: #0f172a; /* Deep professional navy slate */
	--bg-surface: #1e293b; /* Lighter slate for form box */
	--primary-teal: #0ea5e9; /* Electric healthcare blue */
	--primary-hover: #0284c7; /* Sky blue accent */
	--text-white: #f8fafc; /* Crisp text */
	--text-muted: #94a3b8; /* Subtle text grey */
	--border-color: rgba(255, 255, 255, 0.1);
	--radius: 12px;
	--transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

/* STRUCTURAL RESET */
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

body {
	font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
	background-color: var(--bg-main);
	color: var(--text-white);
	min-height: 100vh;
	display: flex;
	flex-direction: column;
}

/* IDENTICAL TOP NAVIGATION BAR WITH RIGHT-ALIGNED BUTTON */
.navbar {
	background-color: var(--bg-surface);
	border-bottom: 1px solid var(--border-color);
	padding: 0 40px;
	height: 70px; /* Matches standard portal navbar heights perfectly */
	position: sticky;
	top: 0;
	z-index: 100;
	display: flex;
	align-items: center;
}

.nav-container {
	width: 100%;
	max-width: 1400px;
	margin: 0 auto;
	display: flex;
	align-items: center;
	justify-content: space-between;
	/* Pushes logo to left, link to right */
}

.logo {
	display: flex;
	align-items: center;
	gap: 10px;
	font-size: 1.25rem;
	font-weight: 700;
	color: var(--text-white);
	text-decoration: none;
}

.logo i, .logo span {
	color: var(--primary-teal);
}

/* HIGH-VISIBILITY LOGIN REDIRECT ON TOP RIGHT SIDE */
.btn-requestt {
	background-color: var(--primary-teal);
	color: #0f172a; /* Dark slate text for perfect contrast */
	border: 1px solid var(--primary-teal);
	padding: 10px 20px;
	border-radius: 8px;
	font-size: 0.9rem;
	font-weight: 600;
	text-decoration: none;
	display: inline-flex;
	align-items: center;
	gap: 8px;
	transition: var(--transition);
	cursor: pointer;
	box-shadow: 0 4px 12px rgba(14, 165, 233, 0.2);
}

.btn-requestt:hover {
	background-color: rgba(14, 165, 233, 0.1);
	color: var(--primary-teal);
	border-color: rgba(14, 165, 233, 0.3);
	box-shadow: none;
	transform: translateY(-1px);
}

/* CENTERED FORMS CONTAINER */
.tracker-wrapper {
	flex: 1;
	display: flex;
	align-items: center;
	justify-content: center;
	padding: 40px 20px;
}

.tracker-card {
	background-color: var(--bg-surface);
	border-radius: var(--radius);
	padding: 40px;
	width: 100%;
	max-width: 450px;
	box-shadow: 0 25px 35px -12px rgba(0, 0, 0, 0.6);
	border: 1px solid rgba(255, 255, 255, 0.03);
}

.tracker-header {
	text-align: center;
	margin-bottom: 32px;
}

.tracker-header i {
	font-size: 2.5rem;
	color: var(--primary-teal);
	margin-bottom: 16px;
}

.tracker-header h2 {
	font-size: 1.75rem;
	font-weight: 700;
	margin-bottom: 8px;
}

.tracker-header p {
	color: var(--text-muted);
	font-size: 0.9rem;
	line-height: 1.5;
}

/* FORM FIELD ELEMENT STYLES */
.form-group {
	margin-bottom: 20px;
}

.form-group label {
	display: block;
	margin-bottom: 8px;
	font-size: 0.9rem;
	font-weight: 600;
	color: var(--text-white);
}

.input-wrapper {
	position: relative;
	display: flex;
	align-items: center;
}

.input-icon {
	position: absolute;
	left: 16px;
	color: var(--text-muted);
}

.form-control {
	width: 100%;
	padding: 14px 16px 14px 44px;
	background-color: rgba(15, 23, 42, 0.6);
	border: 1px solid var(--border-color);
	border-radius: 8px;
	color: var(--text-white);
	font-size: 0.95rem;
	transition: var(--transition);
}

.form-control:focus {
	outline: none;
	border-color: var(--primary-teal);
	box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
}

.btn-submit {
	width: 100%;
	background-color: var(--primary-teal);
	color: #0f172a;
	border: 1px solid var(--primary-teal);
	padding: 14px;
	border-radius: 8px;
	font-size: 1rem;
	font-weight: 600;
	cursor: pointer;
	display: flex;
	align-items: center;
	justify-content: center;
	gap: 10px;
	transition: var(--transition);
	margin-top: 24px;
}

.btn-submit:hover {
	background-color: rgba(14, 165, 233, 0.1);
	color: var(--primary-teal);
	border-color: rgba(14, 165, 233, 0.3);
}

/* SYSTEM MODAL DIALOG POPUPS */
.modal-overlay {
	position: fixed;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
	background: rgba(15, 23, 42, 0.8);
	display: flex;
	justify-content: center;
	align-items: center;
	z-index: 1000;
	backdrop-filter: blur(4px); /* Modern blurred-glass look */
}

.modal-box {
	background-color: var(--bg-surface);
	border: 1px solid rgba(255, 255, 255, 0.05);
	padding: 40px 30px;
	border-radius: var(--radius);
	max-width: 420px;
	width: 90%;
	text-align: center;
	box-shadow: 0 25px 35px -12px rgba(0, 0, 0, 0.8);
	animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.modal-icon-error {
	font-size: 48px;
	color: #ef4444; /* Clean critical red alert color */
	margin-bottom: 20px;
	filter: drop-shadow(0 0 12px rgba(239, 68, 68, 0.2));
}

.modal-box h3 {
	font-size: 1.5rem;
	font-weight: 700;
	margin: 0 0 12px 0;
	color: var(--text-white);
}

.modal-box p {
	color: var(--text-muted);
	font-size: 0.95rem;
	margin-bottom: 28px;
	line-height: 1.6;
}

.btn-modal-close {
	background-color: #ef4444;
	color: var(--text-white);
	border: 1px solid #ef4444;
	padding: 12px 28px;
	border-radius: 8px;
	font-size: 0.95rem;
	font-weight: 600;
	cursor: pointer;
	width: 100%;
	transition: var(--transition);
}

.btn-modal-close:hover {
	background-color: rgba(239, 68, 68, 0.1);
	color: #ef4444;
	border-color: rgba(239, 68, 68, 0.4);
}

@keyframes fadeIn {from { opacity:0;
	transform: scale(0.95) translateY(10px);
}

to {
	opacity: 1;
	transform: scale(1) translateY(0);
}
}
</style>
</head>
<body>

	<!-- TOP NAVIGATION BAR -->
	<nav class="navbar">
		<div class="nav-container">
			<a th:href="@{/}" class="logo"> <i
				class="fa-solid fa-heart-pulse"></i> Hospital <span>Management
					System</span>
			</a>
			<!-- TOP RIGHT SIDE OPTION LINK -->
			<a th:href="@{/login}" class="btn-requestt"> <i
				class="fa-solid fa-right-to-bracket"></i> Return to Login
			</a>
		</div>
	</nav>

	<!-- CONTENT WRAPPER -->
	<main class="tracker-wrapper">
		<div class="tracker-card">

			<div class="tracker-header">
				<i class="fa-solid fa-user-shield"></i>
				<h2>Identity Verification</h2>
				<p>Enter your details below to check your account's existence in
					the database</p>
			</div>

			<!-- SEARCH ACCOUNT FORM -->
			<form th:action="@{/forgot-password/verify}" method="POST">

				<!-- 1. MOBILE NUMBER FIELD -->
				<div class="form-group">
					<label for="mobileNumber">Registered Mobile Number</label>
					<div class="input-wrapper">
						<i class="fa-solid fa-phone input-icon"></i> <input type="tel"
							id="mobileNumber" name="mobile" class="form-control"
							placeholder="Enter your mobile number" required>
					</div>
				</div>

				<!-- 2. DATE OF BIRTH FIELD -->
				<div class="form-group"
					style="display: flex; flex-direction: column; gap: 8px;">
					<label for="dateOfBirth"
						style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted);">Date
						of Birth</label>
					<div class="input-wrapper"
						style="position: relative; display: flex; align-items: center;">

						<!-- Font Awesome Calendar Icon positioned on the left side -->
						<i class="fa-solid fa-calendar-days"
							style="position: absolute; left: 14px; color: var(--text-muted); font-size: 1rem; pointer-events: none;"></i>

						<!-- Date Input Field with Explicit White Text/Icon Scheme Forced Overrides -->
						<input type="date" id="dateOfBirth" name="dob"
							class="form-control color-forced-date" required
							style="width: 100%; padding: 14px 14px 14px 42px; background-color: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-color); border-radius: 8px; color: #ffffff; font-size: 0.95rem; outline: none; transition: var(--transition); color-scheme: dark;"
							onfocus="this.style.borderColor='var(--primary-teal)'"
							onblur="this.style.borderColor='var(--border-color)'">
					</div>
				</div>


				<!-- FORM SUBMIT BUTTON -->
				<button type="submit" class="btn-submit">
					Verify Account <i class="fa-solid fa-magnifying-glass"></i>
				</button>

			</form>

		</div>
	</main>

	<!-- ERROR POPUP MODAL -->
	<div th:if="${param.error != null and param.error[0] == 'notfound'}"
		id="errorModal" class="modal-overlay">
		<div class="modal-box">
			<div class="modal-icon-error">
				<i class="fa-solid fa-triangle-exclamation"></i>
			</div>
			<h3>User Verification Failed</h3>
			<p>no such user with this number with this dob.</p>
			<button type="button" class="btn-modal-close"
				onclick="closePopup('errorModal')">Try Again</button>
		</div>
	</div>

	<!-- SCRIPT FOR CLOSING POPUP WINDOW -->
	<script>
		function closePopup(id) {
			const modal = document.getElementById(id);
			if (modal) {
				modal.style.display = 'none';
			}
		}
	</script>

</body>
</html>
